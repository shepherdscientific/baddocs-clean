[env]
  DATABASE_URL = ""
  REDIS_URL = ""
  ANTHROPIC_API_KEY = ""

[build]
  builder = "heroku"

[[services]]
  internal_port = 8000
  processes = ["app"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
