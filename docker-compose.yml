version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://baddocs:baddocs@db:5432/baddocs
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/data

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: baddocs
      POSTGRES_PASSWORD: baddocs
      POSTGRES_DB: baddocs
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
