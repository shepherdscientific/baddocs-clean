[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baddocs"
version = "1.0.0"
description = "AI-powered documentation generation for legacy codebases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shepherd Scientific"}]
keywords = ["documentation", "legacy-code", "ai", "analysis"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.20",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "isort>=5.0",
    "pre-commit>=3.0",
]

[tool.setuptools]
packages = ["baddocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=baddocs --cov-report=html --cov-report=term-missing"
