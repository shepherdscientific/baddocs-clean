version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: baddocs
      POSTGRES_PASSWORD: baddocs
      POSTGRES_DB: baddocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baddocs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://baddocs:baddocs@db:5432/baddocs
      REDIS_URL: redis://redis:6379/0
      # Inference endpoint (OpenAI-compatible). Point at a budgeted endpoint for
      # a public demo. See .env.example.
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      BADDOCS_TRY_MAX_FILES: ${BADDOCS_TRY_MAX_FILES:-6}
      BADDOCS_TRY_CLONE_TIMEOUT: ${BADDOCS_TRY_CLONE_TIMEOUT:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
